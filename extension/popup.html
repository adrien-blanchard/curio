<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Save to Curio</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon-48.png" alt="" width="32" height="32" />
        <div>
          <strong>Submit a link</strong>
          <span>Curio will analyze this page.</span>
        </div>
      </div>
      <button
        id="open-options"
        class="icon-button"
        type="button"
        aria-label="Open extension settings"
        title="Settings"
      >
        <svg
          aria-hidden="true"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
        >
          <path
            d="m9 3-.5 3-2 1.2-2.8-1-2 3.5L4 12l-2.3 2.3 2 3.5 2.8-1 2 1.2.5 3h4l.5-3 2-1.2 2.8 1 2-3.5L18 12l2.3-2.3-2-3.5-2.8 1-2-1.2-.5-3Z"
          />
          <circle cx="11" cy="12" r="3" />
        </svg>
      </button>
    </header>

    <main>
      <div id="global-status" class="status status-info" role="status" aria-live="polite">
        Connecting to Curio…
      </div>

      <section id="setup-panel" class="panel" hidden aria-labelledby="setup-title">
        <h1 id="setup-title">Connect this extension</h1>
        <p>Set your Curio instance and paste the connection key created in My Account.</p>
        <button id="configure" class="button button-primary" type="button">Open settings</button>
      </section>

      <form id="entry-form" hidden novalidate>
        <div class="identity-row">
          <span>Connected as</span>
          <strong id="profile-label">Connected account</strong>
        </div>

        <div class="field">
          <label for="page-url">URL</label>
          <input
            id="page-url"
            name="url"
            type="url"
            inputmode="url"
            autocomplete="url"
            spellcheck="false"
            placeholder="https://example.com/resource"
            required
          />
        </div>

        <fieldset class="field source-fieldset">
          <legend>Source type</legend>
          <div class="source-options">
            <label>
              <input type="radio" name="sourceType" value="opensource" checked />
              <span
                ><svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <path d="m8 6-6 6 6 6m8-12 6 6-6 6" /></svg
                >Open source</span
              >
            </label>
            <label>
              <input type="radio" name="sourceType" value="proprietary" />
              <span
                ><svg
                  aria-hidden="true"
                  width="14"
                  height="14"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <rect x="4" y="11" width="16" height="10" rx="2" />
                  <path d="M8 11V7a4 4 0 0 1 8 0v4" /></svg
                >Proprietary</span
              >
            </label>
          </div>
        </fieldset>

        <fieldset class="field tag-fieldset">
          <legend>Tags (optional)</legend>
          <p class="field-hint">Choose existing tags for this link.</p>
          <div id="tag-list" class="tag-list" aria-live="polite" aria-busy="true"></div>
          <p id="tag-count" class="tag-count" aria-live="polite">0 of 10 selected</p>
        </fieldset>

        <div id="form-status" class="status" role="status" aria-live="polite" hidden></div>
        <div class="form-footer">
          <button id="submit-entry" class="button button-primary" type="submit">
            <span class="button-icon" aria-hidden="true">+</span
            ><span id="submit-label">Submit</span>
          </button>
        </div>
      </form>
    </main>

    <script type="module" src="popup.mjs"></script>
  </body>
</html>
