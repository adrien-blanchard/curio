name: Feature request
description: Propose a scoped improvement to Curio.
title: "[Feature]: "
labels: [enhancement, needs-triage]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the user or operator problem without private deployment details.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: What observable behavior should change?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Primary surface
      options:
        - Web dashboard
        - API
        - Ingestion workflow
        - Database or authorization
        - Chrome extension
        - Documentation or operations
    validations:
      required: true
  - type: checkboxes
    id: constraints
    attributes:
      label: Constraints considered
      options:
        - label: I considered privacy and data-retention impact.
        - label: I considered role and RLS behavior.
        - label: I considered self-hosting and provider cost.
