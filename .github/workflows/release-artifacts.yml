name: Release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Full CI gate
    uses: ./.github/workflows/ci.yml

  security:
    name: Dependency and secret gate
    uses: ./.github/workflows/security.yml

  codeql:
    name: CodeQL gate
    permissions:
      contents: read
      security-events: write
    uses: ./.github/workflows/codeql.yml

  package:
    name: Deterministic extension ZIP and SBOM
    needs: [quality, security, codeql]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate independent application and extension versions
        id: versions
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          extension_version="$(node -p "require('./extension/manifest.json').version")"
          npm run extension:build -- --check
          grep -F "## [$package_version]" CHANGELOG.md
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            test "$GITHUB_REF_NAME" = "v$package_version"
          fi
          echo "application_version=$package_version" >> "$GITHUB_OUTPUT"
          echo "extension_version=$extension_version" >> "$GITHUB_OUTPUT"
      - name: Build and compare extension archives
        shell: bash
        env:
          EXTENSION_VERSION: ${{ steps.versions.outputs.extension_version }}
        run: |
          mkdir -p artifacts
          archive="artifacts/curio-extension-${EXTENSION_VERSION}.zip"
          comparison="artifacts/curio-extension-${EXTENSION_VERSION}.second.zip"
          npm run extension:build -- --output "$archive"
          npm run extension:build -- --output "$comparison"
          cmp "$archive" "$comparison"
          rm "$comparison"
      - name: Generate and normalize CycloneDX SBOM twice
        shell: bash
        run: |
          normalize_sbom() {
            jq -S '
              del(.serialNumber, .metadata.timestamp)
              | .components = ((.components // []) | sort_by(."bom-ref"))
              | .dependencies = ((.dependencies // [])
                  | sort_by(.ref)
                  | map(.dependsOn = ((.dependsOn // []) | sort)))
            ' artifacts/sbom.cdx.json > artifacts/sbom.normalized.json
            mv artifacts/sbom.normalized.json artifacts/sbom.cdx.json
          }
          npm run sbom
          normalize_sbom
          cp artifacts/sbom.cdx.json artifacts/sbom.first.json
          npm run sbom
          normalize_sbom
          cmp artifacts/sbom.first.json artifacts/sbom.cdx.json
          rm artifacts/sbom.first.json
      - name: Write checksums
        shell: bash
        env:
          EXTENSION_VERSION: ${{ steps.versions.outputs.extension_version }}
        run: |
          cd artifacts
          sha256sum "curio-extension-${EXTENSION_VERSION}.zip" sbom.cdx.json \
            | LC_ALL=C sort > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: curio-release-artifacts-extension-${{ steps.versions.outputs.extension_version }}
          path: |
            artifacts/curio-extension-${{ steps.versions.outputs.extension_version }}.zip
            artifacts/sbom.cdx.json
            artifacts/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
      - name: Create durable GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          EXTENSION_VERSION: ${{ steps.versions.outputs.extension_version }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "artifacts/curio-extension-${EXTENSION_VERSION}.zip"
          artifacts/sbom.cdx.json artifacts/SHA256SUMS --verify-tag --title "Curio
          ${GITHUB_REF_NAME}" --generate-notes
