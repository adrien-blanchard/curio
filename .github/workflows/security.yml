name: Security

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency audit (high and critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  secrets:
    name: Full-history secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Verify the scanner detects a generated canary
        shell: bash
        run: |
          # Keep this canary when updating: v8.30.1 shipped with a detector regression.
          image="ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9"
          canary=".gitleaks-canary.txt"
          trap 'rm -f "$canary"' EXIT
          printf 'token = "ghp_%s"\n' "$(openssl rand -hex 18)" > "$canary"
          set +e
          docker run --rm -v "$PWD:/repo" "$image" \
            dir --redact --no-banner /repo >/dev/null 2>&1
          status=$?
          set -e
          if [[ "$status" -ne 1 ]]; then
            echo "Gitleaks did not detect its generated canary." >&2
            exit 1
          fi
      - name: Scan committed history with Gitleaks
        shell: bash
        run: |
          image="ghcr.io/gitleaks/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9"
          docker run --rm -v "$PWD:/repo" "$image" git --redact --no-banner /repo
