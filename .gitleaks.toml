title = "Curio secret scanning"

[extend]
useDefault = true

[[allowlists]]
description = "Public Chrome development identity, not a private key or API credential"
condition = "AND"
paths = ['''(^|/)extension/manifest\.json$''']
regexTarget = "line"
regexes = ['''"key":\s*"MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAqW3ZNz2LhD8kR5A3aecwl6k5nI/''']
